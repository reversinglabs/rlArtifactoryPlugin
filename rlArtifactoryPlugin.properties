//// General settings for RLArtifactoryPlugin.
//// lines starting with //// are comments only
//// lines starting with // are configuration options
//// Note: all data is in groovy format.

//////////////////////////////////////////////////////
//// message feedback: the admin contact info in the block message.

//// admin_name: string, mandatory, default: ""
admin_name = 'Your Friendly Administrator'

//// admin_email: string, mandatory, default: ""
admin_email = 'your.friendly@administrator.noreply'

//////////////////////////////////////////////////////
//// optional allow pass-through based on ip4 addresses.

//// never_block_ip_list: optional: list of string, default []
// never_block_ip_list = ['10.2.3.4', '10.6.7.8']

//////////////////////////////////////////////////////
//// optional allow pass-through based on specific repository names.

//// never_block_repo_list: optional: list of string, default []
// never_block_repo_list = [ 'aaa', 'bbb' ]

//////////////////////////////////////////////////////
//// Proxy: optional: use a proxy with optional auth.

//// proxy.server:string, optional, default: ''
// proxy.server = '<proxy dns or ip>'

//// proxy.port: integer, default 0. // mandatory if proxy.server is set.
// proxy.port = <mandatory proxy port>

//// proxy.username: string, optional, default: ''
// proxy.username = '<your proxy auth username>'

//// proxy.password: string, mandatory if proxy.username is set.
// proxy.password = '<your proxy auth password>'

//////////////////////////////////////////////////////
//// optional master off switch

//// block_downloads_failed: boolean, optional, default: true
// block_downloads_failed = false

//////////////////////////////////////////////////////
//// Secure Software configuration
////
//// all community options are optional when not using the community.
//// when using the community: server and token become mandatory.

//// community.server: string
// community.server = '<server dns>'

//// community.token: string
// community.token = '<your auth token>'

//////////////////////////////////////////////////////
//// optional: only fetch community data for specific artifactory repo_types.
//// we currently only support the repo_types: 'npm','pypi','nuget','gems','maven','gradle' (maven, gradle: binaries only).
//// a list without any supported type analyzes nothing (WARN).

//// community.inspectPackageTypes: list of string, optional, default: ['npm','pypi','nuget','gems','maven','gradle']
// community.inspectPackageTypes = [ 'npm','pypi','nuget','gems','maven','gradle']

//////////////////////////////////////////////////////
//// optional: tune ratelimit */
//// By default any community request that hits a rate limit 429 response, is automatically retried.

//// community.autoAdaptToRateLimit: boolean, optional , default: true
// community.autoAdaptToRateLimit = true

//// community.defaultDelayRateLimit: integer (seconds), optional, default: 10.
// community.defaultDelayRateLimit = 10

//////////////////////////////////////////////////////
//// optional: tune the scan data refresh.
//// To save bandwith and cost api calls no api calls are done when we already have recent data from the community
////   or when there is currently no community data available for this artifact.

//// community.refreshDelay: integer (hours), optional, default: 24.
//// in case we have the data in the community, refresh it after 24 hours.
// community.refreshDelay = 24

//// community.notfoundDelay: integer (hours), optional, default: 240.
//// in case we dont have the data in the community, retry every 10 days.
// community.notfoundDelay = 240

//// Both delays: the next lookup is done when the last one is at least delay + 1 hours old
//// (whole hours, rounded down); 0 means at most once per hour.

//////////////////////////////////////////////////////
//// Profile configuration

//// The Default profile, when not using a portal profile.
//// community.profile.path: string, optional, default: 'rl-profile.json'.
//// 3 default profiles are provided by ReversingLabs:
////   'rl-oss-baseline.json', 'rl-oss-hardened.json', 'rl-oss-minimum.json'
//// The default provided 'rl-profile.json' is the baseline.
//// The file path is relative to the artifactory plugin directory.
// community.profile.path = 'rl-profile.json'

//// optional: use a profile from the portal (will not work with the free api).
//// You can use a organization OR a group profile (but not both)
////   for all scans if you have one configured in the portal.
//// When using a organization profile, the 'community.profile.portalGroup' must not be configured.
//// When using a group profile, both the 'community.profile.portalOrganization' and the 'community.profile.portalGroup' must be configured.

//// community.profile.portalOrganization: // string, optional, default: ''. // only needed when a portal profile must be used.
// community.profile.portalOrganization = '<a org name>'

//// community.profile.portalGroup: string, optional, default: ''. // only needed when a portal group profile must be used.
// community.profile.portalGroup = '<a group name>'

//// When using a portal profile the profile is cached for a configurable time so we dont overload the portal api.
//// The location of the cachefile and the cache refresh time can be tuned.

//// community.profile.cacheDirectory: string, optional, default: '/var/tmp'. // must exist and be writable.
// community.profile.cacheDirectory = '/var/tmp'

//// community.profile.cacheRefreshDelay: integer (minutes), optional, default: 30.
// community.profile.cacheRefreshDelay = 30
